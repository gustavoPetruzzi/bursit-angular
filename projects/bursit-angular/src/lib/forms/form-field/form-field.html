<div class="bursit-form-field-control-wrapper">
  <ng-content select="[bursitLabel]"></ng-content>

  <ng-content></ng-content>
</div>

@if (formFieldControl()?.invalid()) {
  <div class="bursit-form-field-error-slot" [id]="fieldId + '-error'">
    <ng-content select="[bursitError]"></ng-content>
  </div>
}
<div class="bursit-form-field-message-slot" [id]="fieldId + '-message'">
  <ng-content select="[bursitMessage]"></ng-content>
</div>
